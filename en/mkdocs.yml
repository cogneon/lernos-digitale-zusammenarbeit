    - Download:
      - PDF Version: https://github.com/cogneon/lernos-digitale-zusammenarbeit/blob/master/en/2.0%20lernOS%20Digital%20Collaboration%20Guide_En.pdf
      - Word Version: https://github.com/cogneon/lernos-digitale-zusammenarbeit/blob/master/en/2.0%20lernOS%20Digital%20Collaboration%20Guide_En.docx
      - Canvas: https://github.com/cogneon/lernos-digitale-zusammenarbeit/blob/master/en/Templates/Collaboration%20Canvas%20(lernOS%20Digitale%20Zusammenarbeit).pptx
    - Links:
      - lernos.org: https://lernos.org
      - CONNECT Community: https://community.cogneon.de
      - Peerfinder: https://web.peerfinder.app

theme:
    name: 'material'
    custom_dir: src/overrides
    palette:
        scheme: lernos
    language: en
    icon:
      logo: material/home
      repo: fontawesome/brands/github
    features:
      - toc.integrate
      - search.share
      - navigation.top
      - navigation.footer      

extra_css:
  - stylesheets/extra.css

repo_name: 'cogneon/lernos-digitale-zusammenarbeit'
repo_url: 'https://github.com/cogneon/lernos-digitale-zusammenarbeit'

extra:
    social:
        - icon: fontawesome/brands/mastodon
          link: 'https://colearn.social/@lernos'
        - icon: fontawesome/brands/linkedin
          link: 'https://www.linkedin.com/showcase/lern-os'
        - icon: fontawesome/brands/github
          link: 'https://github.com/cogneon'
    giscus: true
    analytics:
       provider: custom
    alternate:
         - name: German
           link: https://cogneon.github.io/lernos-digitale-zusammenarbeit/de
           lang: de
    generator: false

markdown_extensions:
  - footnotes
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

copyright: <a href="\3-05-AboutlernOS.md">CC BY 4.0</a> - <a href="\6-03-Contact">Contact</a>
