      - Conclusion: 4-15-Conclusion.md
    - Theory:
      - Theory Cooperation: 5-01-Cooperation.md
      - Theory Communication: 5-02-Communication.md
      - Theory Retrospective: 5-03-Retrospective.md
      - Theory Meetings: 5-04-Meetings.md
      - Theory Decisions: 5-05-Decisions.md
      - Theory Knowledge Management: 5-06-Knowledge-Management.md
    - Appendix:
      - Templates: 6-01-Templates.md
      - Acknowledgements: 6-02-Acknowledgements.md
