      - About lernOS: 3-05-AboutlernOS.md   
    - Learning Path: 
      - Your learning journey at a glance: 4-01-AtAGlance.md
      - Preparatory meeting: 4-02-PreparatoryMeeting.md
      - Kata 1: 4-03-Kata1.md
      - Kata 2: 4-04-Kata2.md
      - Kata 3: 4-05-Kata3.md
      - Kata 4: 4-06-Kata4.md
      - Kata 5: 4-07-Kata5.md
      - Kata 6: 4-08-Kata6.md
      - Kata 7: 4-09-Kata7.md
